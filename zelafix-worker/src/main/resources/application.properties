spring.application.name=zelafix-worker
server.port=${WORKER_PORT:8081}
spring.threads.virtual.enabled=true
spring.jackson.time-zone=America/Sao_Paulo

# RabbitMQ (CloudAMQP)
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:}
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Spring AI (LLM Multimodal)
spring.ai.openai.base-url=${AI_BASE_URL}
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.chat.options.model=${AI_MODEL}
spring.ai.openai.chat.options.temperature=0.1
spring.ai.openai.chat.options.max-tokens=1500
spring.ai.retry.max-attempts=1

# Logs detalhados de IA
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.fiap.com.br.zelafix.worker=DEBUG

# Actuator & Docker
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
spring.docker.compose.enabled=false
