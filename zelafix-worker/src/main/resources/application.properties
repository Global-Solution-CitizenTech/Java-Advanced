spring.application.name=zelafix-worker
server.port=${WORKER_PORT:8081}

# Timezone
spring.jackson.time-zone=America/Sao_Paulo

# RabbitMQ (CloudAMQP - Consumidor Assíncrono Online via AMQPS)
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:${RABBITMQ_URI:}}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:true}
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.concurrency=${RABBITMQ_CONCURRENCY:1}
spring.rabbitmq.listener.simple.max-concurrency=${RABBITMQ_MAX_CONCURRENCY:3}
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_PREFETCH:1}

# Spring AI (Integração Groq Multimodal para triagem inteligente)
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=${GROQ_MODEL:qwen/qwen3.8-27b}
spring.ai.openai.chat.options.temperature=0.3

# Actuator & Monitoramento
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
spring.docker.compose.enabled=false
info.app.name=ZelaFix Worker
info.app.description=Worker Assíncrono de Triagem Inteligente com Spring AI e Agregador de Votos RabbitMQ
info.app.version=1.0.0
