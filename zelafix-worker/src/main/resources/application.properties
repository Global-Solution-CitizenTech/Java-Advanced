spring.application.name=zelafix-worker
server.port=${WORKER_PORT:8081}
spring.jackson.time-zone=America/Sao_Paulo

# RabbitMQ (CloudAMQP)
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:${RABBITMQ_URI:}}
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.concurrency=${RABBITMQ_CONCURRENCY:1}
spring.rabbitmq.listener.simple.max-concurrency=${RABBITMQ_MAX_CONCURRENCY:3}
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_PREFETCH:1}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Spring AI (Azure AI Foundry Multimodal)
spring.ai.openai.base-url=${AI_BASE_URL:https://ai-zelafix-561432.services.ai.azure.com/openai/v1}
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.chat.options.model=${AI_MODEL:phi-4-multimodal}
spring.ai.openai.chat.options.temperature=0.3

# Actuator & Docker
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
spring.docker.compose.enabled=false
