spring.application.name=zelafix-worker
server.port=${WORKER_PORT:8081}

# Timezone
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Banco de Dados Oracle FIAP
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/orcl}
spring.datasource.username=${ORACLE_USER:RM561432}
spring.datasource.password=${ORACLE_PASSWORD:301006}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ (Consumidor Assíncrono - Opção A)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:true}
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# Spring AI (Integração Groq / OpenAI para triagem inteligente)
spring.ai.openai.base-url=${OPENAI_BASE_URL:${GROQ_BASE_URL:https://api.groq.com/openai/v1}}
spring.ai.openai.api-key=${OPENAI_API_KEY:${GROQ_API_KEY:mock-key}}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:${GROQ_MODEL:openai/gpt-oss-120b}}
spring.ai.openai.chat.options.temperature=0.3

# Actuator & Monitoramento
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=ZelaFix Worker
info.app.description=Worker Assíncrono de Triagem Inteligente com Spring AI e Agregador de Votos RabbitMQ
info.app.version=1.0.0

