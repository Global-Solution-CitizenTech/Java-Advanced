spring.application.name=zelafix-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Upload de Arquivos / Fotos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Timezone
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Cliente HTTP (ViaCEP)
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=40s

# Banco de Dados Oracle FIAP
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Migrations com Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=FLYWAY_ZELAFIX_HISTORY
spring.flyway.placeholders.ADMIN_BCRYPT_HASH=${ADMIN_BCRYPT_HASH:$2a$10$SXCHKmagXlo4hjWTaTfWIeGT6Qh8BWLEUgWHsxPEWDxKpQX1Q96Yi}

# RabbitMQ (CloudAMQP)
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:${RABBITMQ_URI:}}
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.concurrency=${RABBITMQ_CONCURRENCY:3}
spring.rabbitmq.listener.simple.max-concurrency=${RABBITMQ_MAX_CONCURRENCY:5}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Chaves RSA (JWT)
rsa.private-key=${RSA_PRIVATE_KEY:classpath:keys/private_key.pem}
rsa.public-key=${RSA_PUBLIC_KEY:classpath:keys/public_key.pem}

# Actuator & Docker
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
spring.docker.compose.enabled=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs
