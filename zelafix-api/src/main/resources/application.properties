spring.application.name=zelafix-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Upload de Arquivos / Fotos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Timezone e Internacionalizacao
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Banco de Dados Oracle FIAP
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/orcl}
spring.datasource.username=${ORACLE_USER:RM561432}
spring.datasource.password=${ORACLE_PASSWORD:301006}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Migrations com Flyway (Oracle Database)
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.table=FLYWAY_ZELAFIX_HISTORY
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.ADMIN_BCRYPT_HASH=${ADMIN_BCRYPT_HASH:$2a$10$SXCHKmagXlo4hjWTaTfWIeGT6Qh8BWLEUgWHsxPEWDxKpQX1Q96Yi}

# RabbitMQ (Mensageria Assincrona - Opcao A)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:true}
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# Chaves RSA (Spring Security JWT)
rsa.private-key=${RSA_PRIVATE_KEY:classpath:keys/private_key.pem}
rsa.public-key=${RSA_PUBLIC_KEY:classpath:keys/public_key.pem}

# Actuator & Monitoramento
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.rabbit.enabled=false
management.info.env.enabled=true
info.app.name=ZelaFix API
info.app.description=API RESTful de Zeladoria Urbana Colaborativa (FIAP Global Solution 2026/2 - CitizenTech)
info.app.version=1.0.0

# Swagger / OpenAPI 3.0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs

