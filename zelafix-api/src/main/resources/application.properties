spring.application.name=zelafix-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Upload de Arquivos / Fotos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Timezone e Internacionalizacao
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Timeouts e endpoints de clientes HTTP (ViaCEP e Worker Spring AI)
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=40s
zelafix.worker.url=${WORKER_URL:http://localhost:8081}

# Banco de Dados Oracle FIAP
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Migrations com Flyway (Oracle Database)
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.table=FLYWAY_ZELAFIX_HISTORY
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.ADMIN_BCRYPT_HASH=${ADMIN_BCRYPT_HASH:$2a$10$SXCHKmagXlo4hjWTaTfWIeGT6Qh8BWLEUgWHsxPEWDxKpQX1Q96Yi}

# RabbitMQ (CloudAMQP - Mensageria Assincrona Online via AMQPS)
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:${RABBITMQ_URI:}}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:true}
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.concurrency=${RABBITMQ_CONCURRENCY:3}
spring.rabbitmq.listener.simple.max-concurrency=${RABBITMQ_MAX_CONCURRENCY:5}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Chaves RSA (Spring Security JWT)
rsa.private-key=${RSA_PRIVATE_KEY:classpath:keys/private_key.pem}
rsa.public-key=${RSA_PUBLIC_KEY:classpath:keys/public_key.pem}

# Actuator & Monitoramento
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.rabbit.enabled=true
management.info.env.enabled=true
spring.docker.compose.enabled=false
info.app.name=ZelaFix API
info.app.description=API RESTful de Zeladoria Urbana Colaborativa (FIAP Global Solution 2026/2 - CitizenTech)
info.app.version=1.0.0

# Swagger / OpenAPI 3.0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs
