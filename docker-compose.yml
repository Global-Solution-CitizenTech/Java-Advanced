services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zelafix-rabbitmq
    ports:
      - "5672:5672"     # Porta AMQP do RabbitMQ
      - "15672:15672"   # Painel Web de Gestao (guest / guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

