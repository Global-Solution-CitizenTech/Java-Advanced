# NOTA DE ARQUITETURA & AMBIENTE:
# Este docker-compose.yml destina-se EXCLUSIVAMENTE ao ambiente de desenvolvimento
# local (DevEx offline / testes unitários locais do desenvolvedor).
#
# Em PRODUÇÃO / NUVEM (Microsoft Azure):
#   - API REST: Azure App Service Linux (app-zelafix-561432)
#   - Worker IA: Azure App Service Linux (app-zelafix-worker-561432)
#   - Mensageria: Azure Container Instances (zelafix-rabbitmq-561432)
#   - Banco de Dados: Oracle Enterprise 19c (FIAP On-Premises)
#   - IA Multimodal: Groq API (Qwen 3.8 27B Vision)
# =============================================================================

services:
  oracle:
    image: gvenzl/oracle-free:slim-faststart
    container_name: zelafix-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: zelafix
      APP_USER_PASSWORD: zelafix
    volumes:
      - oracle_data:/opt/oracle/oradata

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zelafix-rabbitmq
    ports:
      - "5672:5672"     # Porta AMQP do RabbitMQ
      - "15672:15672"   # Painel Web de Gestao (guest / guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  oracle_data:
